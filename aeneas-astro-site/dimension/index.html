						<!-- Intro -->
							<article id="intro">
								<h2 class="major">Intro</h2>
								<span class="image main"><img src="images/pic01.jpg" alt="" /></span>
								<p>I'm a recent Physics graduate from the University of Connecticut (B.S., May 2026), preparing to apply to PhD and master's programs in astronomy and astrophysics for Fall 2027. My research focuses on star formation in nearby galaxies, using multi-wavelength survey data to understand how gas converts into stars across different galactic environments.</p>
								<p>As an undergraduate researcher under Dr. Chris Faesi, I worked as part of the <strong>PHANGS collaboration</strong>, studying the Kennicutt&ndash;Schmidt star formation relation at ~100&nbsp;pc resolution in the nearby spiral galaxy NGC&nbsp;1566. You can read more about this work in <a href="#research">Research</a> and <a href="#publications">Publications</a> below.</p>
							</article>

						<!-- Research -->
							<article id="research">
								<h2 class="major">Research</h2>
								<span class="image main"><img src="images/pic02.jpg" alt="" /></span>
								<h3>Star Formation in NGC 1566</h3>
								<p>My primary research project examines the Kennicutt&ndash;Schmidt (KS) star formation relation &mdash; the empirical link between gas surface density and star formation rate &mdash; at ~100&nbsp;pc resolution in the nearby spiral galaxy NGC&nbsp;1566. The analysis combines dust-corrected H&alpha; emission from <strong>PHANGS&ndash;MUSE</strong> (tracing recent star formation) with CO(2&ndash;1) emission from <strong>PHANGS&ndash;ALMA</strong> (tracing molecular gas), resolved on a pixel-by-pixel basis across different galactic environments (e.g. spiral arms, bar, disk).</p>
								<p>Fitting is done with a Bayesian hierarchical MCMC regression (LinMix, Kelly 2007) that accounts for heteroscedastic per-pixel measurement errors, which is more statistically robust than an ordinary least-squares fit for this kind of astronomical data.</p>
								<h3>Extension: Toomre Q Stability</h3>
								<p>I'm currently extending this analysis to incorporate the Toomre Q stability parameter, which characterizes a disk's local resistance to gravitational collapse. This involves deriving a rotation curve for NGC 1566 from scratch using tilted-ring fitting methods applied to PHANGS&ndash;ALMA moment maps, then connecting environment-resolved Q profiles back to the KS-law results.</p>
								<h3>Skills &amp; Tools</h3>
								<ul class="alt">
									<li>Python (NumPy, Astropy, Matplotlib) for multi-tracer emission map analysis</li>
									<li>FITS file handling and pixel-resolved photometry</li>
									<li>Bayesian MCMC regression and statistical fitting</li>
									<li>LaTeX (AASTeX) for manuscript preparation</li>
								</ul>
							</article>
